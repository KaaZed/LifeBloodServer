version: "3.9"

services:
  bot:
    build: .
    container_name: lifeblood-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_DSN=${DB_DSN:-postgresql://lifeblood:lifeblood@db:5432/lifeblood}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - BOT_WEBHOOK_DOMAIN=${BOT_WEBHOOK_DOMAIN}
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: lifeblood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeblood}
      POSTGRES_USER: ${POSTGRES_USER:-lifeblood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeblood}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
